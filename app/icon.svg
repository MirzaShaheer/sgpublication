<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="32" height="32" role="img" aria-label="Selune Global Publication">
  <title>Selune Global Publication</title>
  <!--
    The favicon: the seal reduced until it survives 16px.

    Every other seal on the site is the supplied artwork: components/brand/Seal
    renders public/logo.png, and app/apple-icon.png is the same file at 180px.
    This one is drawn, because at 16 device pixels the photographic mark, with
    its bevels and its drop shadow, collapses into a brown blur. The paths are
    literals rather than imports because a favicon is a static file: it renders
    outside the document and can reach neither the module graph nor the CSS
    tokens. This is now the only copy of the mark as vector, so if the artwork
    is ever replaced, redraw it here to match.

    Kept: the disc and the interlocked gold SG, which is what identifies this
    logo at a glance.

    Dropped: the quill, the inkpot, the open book and the wordmark. At 16px the
    whole mark is 16 device pixels across, so the book would be about three
    pixels tall and the wordmark's 25 characters would be a smear. They are
    drawn nowhere here rather than drawn badly.

    The strokes are heavier than the full seal's 14 and 20. A stroke of 14 on
    this grid is 1.1 device pixels at 16px and washes out to nothing, so the
    letters are set at 22 and 30 instead: the same forms, inked for the size.

    TO USE THE ARTWORK HERE ANYWAY: delete this file and add app/icon.png.
    Next's file convention picks up either one, so no code and no metadata
    changes are needed. Look at it at 16px first.
  -->

  <!-- the disc, full bleed, matching the radial field of the full seal -->
  <circle cx="100" cy="100" r="100" fill="#3B2820" />

  <!-- G, laid down first so the S crosses over it -->
  <path
    d="M159.6 86.3A40 40 0 1 0 159.6 137.7L159.6 112L134 112"
    fill="none"
    stroke="#C9973F"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!--
    S, twice: a wide bark stroke first, then the gold over it. The dark pass is
    the keyline that separates the two letters where they overlap, which is the
    separation the bevel does in the full artwork.
  -->
  <path
    d="M111 65C111 47.5 92.9 39.4 77.9 45C60.4 51.3 56 70 69.8 80.6C81.6 90 97.9 94.4 106.6 105.6C117.9 120 106 140 87.3 141.9C69.8 143.8 53.5 134.4 49.8 119.4"
    fill="none"
    stroke="#3B2820"
    stroke-width="30"
    stroke-linecap="round"
  />
  <path
    d="M111 65C111 47.5 92.9 39.4 77.9 45C60.4 51.3 56 70 69.8 80.6C81.6 90 97.9 94.4 106.6 105.6C117.9 120 106 140 87.3 141.9C69.8 143.8 53.5 134.4 49.8 119.4"
    fill="none"
    stroke="#E5BE72"
    stroke-width="22"
    stroke-linecap="round"
  />
</svg>
